.bb{--turf:#0C2218;--turf2:#0F2A1D;--panel:#133021;--panel2:#183B2A;--line:#2A5641;--chalk:#F2F4EE;--mute:#A6BBAE;--dim:#6E897A;--board:#0E1A2B;--board2:#15253A;--bezel:#26384F;--led:#FFB12E;--ledoff:#271F13;--red:#E03A2E;--good:#86DB98;--paper:#FAFAF6;--ink:#15191A;
min-height:100vh;-webkit-text-size-adjust:100%;text-size-adjust:100%;color:var(--chalk);
background-color:var(--turf);background-image:repeating-linear-gradient(180deg,var(--turf) 0 72px,var(--turf2) 72px 144px);
font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.bb *{box-sizing:border-box}
.bb h1,.bb h2,.bb h3,.bb p,.bb ol,.bb ul{margin:0}
.bb input,.bb select,.bb textarea{min-width:0;max-width:100%;font-size:16px}
.bb input[type=range]{width:100%;margin:6px 0;accent-color:var(--led)}
.bb input[type=checkbox]{accent-color:var(--led)}
.bb button{overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
.bb button:focus-visible,.bb select:focus-visible,.bb input:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 64px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--mute);font-size:13px}
.mt{margin-top:12px}
.stack{display:grid;gap:8px}

/* ---- scoreboard ---- */
.board{position:relative;background-color:var(--board);background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.3px);background-size:5px 5px;border-radius:14px;padding:14px 14px 12px;box-shadow:inset 0 0 0 1px var(--bezel),inset 0 0 0 5px var(--board),inset 0 0 0 6px #1D2E45,0 14px 30px rgba(0,0,0,.4)}
.seg{display:block;overflow:visible;filter:drop-shadow(0 0 3px rgba(255,177,46,.45))}
.seg .on{fill:var(--led)}
.seg .off{fill:var(--ledoff)}
.blabel{font-size:11px;color:#8FA3BC;letter-spacing:.06em;line-height:1.2}
.btop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bfy{display:flex;align-items:flex-end;gap:5px;color:#8FA3BC;font-size:12px}
.ghost{appearance:none;flex-shrink:0;white-space:nowrap;background:transparent;border:1px solid #33475F;color:#C9D5E3;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.bmain{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}
.bno{display:grid;justify-items:center;gap:4px;min-width:84px;padding:8px 8px 6px;border-radius:8px;background:#0A1422;box-shadow:inset 0 0 0 1px #1F3048}
.bwho{min-width:0}
.bwho .pname{font-size:25px;font-weight:900;letter-spacing:.04em;line-height:1.25;overflow-wrap:anywhere}
.bwho .org{font-size:13px;color:#B9C6D6;line-height:1.5;overflow-wrap:anywhere}
.bwho .pay{font-size:13px;color:var(--led);margin-top:2px}
.plates{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.25fr) minmax(0,1fr);gap:6px;margin-top:12px}
.plate{display:grid;justify-items:center;align-content:center;gap:3px;background:#0A1422;border-radius:6px;padding:7px 6px;min-width:0;min-height:54px;box-shadow:inset 0 0 0 1px #1F3048}
.plate .k{font-size:11px;color:#8FA3BC;line-height:1.2}
.plate .v{font-size:15px;font-weight:800;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.3}
.lamps{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;padding:0 2px}
.lamprow{display:flex;align-items:center;gap:5px;font-size:12px;color:#9FB1C6}
.lamprow b{font-weight:700;margin-right:3px}
.lamp{width:11px;height:11px;border-radius:50%;background:#1A2638;box-shadow:inset 0 0 0 1px #2C3E57;display:inline-block;flex-shrink:0}
.lamp.a{background:var(--led);box-shadow:0 0 7px rgba(255,177,46,.75)}
.lamp.g{background:#4FD17A;box-shadow:0 0 7px rgba(79,209,122,.65)}
.lamp.r{background:#FF4A3A;box-shadow:0 0 8px rgba(255,74,58,.75)}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 8px}
.steps span{height:5px;border-radius:1px;background:#1D2B40}
.steps span.on{background:var(--led);box-shadow:0 0 6px rgba(255,177,46,.5)}
.stepname{display:flex;align-items:flex-end;gap:10px;font-size:21px;font-weight:900;letter-spacing:.03em;line-height:1.2}

/* ---- hero ---- */
.hero{padding:22px 18px 18px}
.htitle{display:grid;gap:2px}
.htitle .l1{font-size:46px;font-weight:900;letter-spacing:.06em;line-height:1.05}
.htitle .l2{font-size:18px;font-weight:700;letter-spacing:.32em;color:var(--led)}
.hlead{color:#B9C6D6;font-size:14px;margin-top:12px}
.diamond{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;position:relative}
.diamond:before{content:"";position:absolute;left:12.5%;right:12.5%;top:9px;height:2px;background:repeating-linear-gradient(90deg,#E9EDF3 0 8px,transparent 8px 13px);opacity:.55}
.diamond li{display:grid;justify-items:center;gap:6px;font-size:12px;color:#C9D5E3;position:relative}
.diamond i{width:14px;height:14px;background:var(--chalk);transform:rotate(45deg);margin-top:2px;box-shadow:0 0 0 3px var(--board)}
.diamond li:last-child i{transform:none;width:16px;height:16px;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);margin-top:1px}

/* ---- panels & controls ---- */
.card{background:rgba(19,48,33,.94);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;min-width:0;overflow-wrap:anywhere}
.card h3{font-size:17px;font-weight:800;margin-bottom:10px;line-height:1.4;letter-spacing:.02em}
.card p+p{margin-top:6px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.phead h3{margin:0}
.phead .role{font-size:13px;font-weight:700;color:var(--led);text-align:right}
.btn{appearance:none;border:0;border-radius:8px;background:var(--chalk);color:#0D2218;font:inherit;font-weight:800;letter-spacing:.03em;padding:14px 16px;width:100%;cursor:pointer;line-height:1.4;box-shadow:0 3px 0 #B8C2B6}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #B8C2B6}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sub{background:transparent;color:var(--chalk);box-shadow:inset 0 0 0 1.5px rgba(242,244,238,.5);font-weight:700}
.btn.sub:active{transform:none;background:rgba(255,255,255,.06)}
.btn.inline{width:auto;padding:9px 14px;font-size:13px;white-space:nowrap}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 3px 0 #8E2017}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;width:100%;display:block;position:relative}
.opt[aria-pressed="true"]{border-color:var(--led);box-shadow:inset 0 0 0 1px var(--led);background:#20432F}
.opt[aria-pressed="true"]:after{content:"";position:absolute;right:12px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--led);box-shadow:0 0 7px rgba(255,177,46,.8)}
.opt .t{font-weight:800;display:block;padding-right:18px}
.opt .d{font-size:13px;color:var(--mute);display:block;margin-top:2px}
.opt .x{font-size:12px;color:#F6B98A;display:block;margin-top:3px}
.opt:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--chalk);line-height:1.4}
.chip[aria-pressed="true"]{background:var(--led);color:#211605;border-color:var(--led);font-weight:800}
.chip:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px;background:var(--board);border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bezel)}
.tab{border:0;background:transparent;padding:11px 0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:#8FA3BC}
.tab[aria-selected="true"]{color:var(--led);box-shadow:inset 0 -3px 0 var(--led)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;min-width:0;border-bottom:1px solid rgba(42,86,65,.55)}
.row:last-child{border-bottom:0}
.row>span:first-child{color:var(--mute);font-size:13px;flex-shrink:0;max-width:45%}
.row>b{text-align:right;font-weight:700;min-width:0;overflow-wrap:anywhere}
.label{font-size:13px;color:var(--mute);margin:14px 0 8px;font-weight:700}
.tile{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:3px;background:var(--board);color:var(--chalk);font-weight:900;font-size:15px;box-shadow:inset 0 0 0 1px var(--bezel)}
.tile.hi{color:var(--led);text-shadow:0 0 6px rgba(255,177,46,.6)}
.tile.lo{color:#7F92A8}
.ledbar{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;min-width:0}
.ledbar i{height:9px;border-radius:1px;background:rgba(255,255,255,.07)}
.ledbar i.on{background:var(--chalk)}
.ledbar i.hi{background:var(--led);box-shadow:0 0 4px rgba(255,177,46,.6)}
.statrow{display:grid;grid-template-columns:minmax(0,98px) 26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 0}
.statrow>span:first-child{font-size:14px;overflow-wrap:anywhere}
.statrow .val{text-align:right;font-size:17px;font-weight:800;white-space:nowrap;min-width:48px}
.statrow .unit{font-size:11px;color:var(--mute);font-weight:400;margin-left:1px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;margin-top:14px}
.field>label{font-size:13px;color:var(--mute);font-weight:700}
.field>label b{color:var(--chalk)}
.input,.select{font:inherit;font-size:16px;line-height:1.4;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#0E2518;color:var(--chalk);width:100%;min-width:0;display:block;margin:0}
.select option,.select optgroup{color:#111;background:#fff}
.inputrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.inputrow>b{min-width:0;overflow-wrap:anywhere}
.checkrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;margin-top:14px}
.checkrow input{width:20px;height:20px;margin:3px 0 0}
.alloc{display:grid;grid-template-columns:minmax(0,1fr) 26px auto auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(42,86,65,.55)}
.alloc>span:first-child{min-width:0;overflow-wrap:anywhere}
.alloc .v{text-align:right;font-size:17px;font-weight:800;white-space:nowrap;min-width:40px}
.stepper{display:flex;align-items:center;gap:4px;justify-content:flex-end;flex-shrink:0}
.stepper button{flex:0 0 34px;padding:0;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:18px;line-height:1;cursor:pointer;color:var(--chalk)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.pool{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:8px;z-index:5;margin-bottom:8px;padding:10px 14px}
.pool .k{font-weight:800}
.navbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px;margin-top:16px;align-items:stretch}
.note{font-size:14px;padding:2px 0 2px 10px;border-left:3px solid var(--line);margin-top:8px}
.note.warn{border-left-color:var(--red)}
.warnbar{background:rgba(224,58,46,.16);color:#FFD3CC;border:1px solid rgba(224,58,46,.5);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:10px}
.delta{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(134,219,152,.14);color:var(--good);margin:4px 5px 0 0;font-weight:700}
.delta.neg{background:rgba(224,58,46,.16);color:#FF9C92}
.delta.gold{background:rgba(255,177,46,.16);color:var(--led)}
.list{padding:0;margin:0;list-style:none}
.list li{padding:8px 0;border-bottom:1px solid rgba(42,86,65,.55)}
.list li:last-child{border-bottom:0}

/* ---- result pieces ---- */
.tours{list-style:none;padding:0;margin:4px 0 0}
.tours li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(166,187,174,.25)}
.tours li span{min-width:0;overflow-wrap:anywhere;font-size:14px}
.res{flex-shrink:0;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(242,244,238,.4);white-space:nowrap}
.res.win{background:var(--led);color:#211605;box-shadow:none}
.strip{margin-top:12px}
.shead{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:4px}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:rgba(42,86,65,.7);border-radius:6px;overflow:hidden}
.cell{background:#0F291C;padding:6px 4px 5px;text-align:center;display:grid;gap:1px}
.cell .k{font-size:11px;color:var(--mute);line-height:1.2}
.cell .v{font-size:18px;font-weight:800;line-height:1.25;white-space:nowrap}
.cta{margin-top:14px}
.teamlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;list-style:none;padding:0}
.teamlist li{background:var(--board);box-shadow:inset 0 0 0 1px var(--bezel);border-radius:6px;padding:9px 8px;text-align:center;font-size:13px;font-weight:700}
.stars{color:var(--led);letter-spacing:1px;font-size:13px}
.tblwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:700;color:var(--mute);text-align:right;padding:5px 5px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
.tbl td{text-align:right;padding:7px 5px;border-bottom:1px solid rgba(42,86,65,.45);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.total td{font-weight:800;color:var(--led);border-bottom:0;border-top:1px solid var(--line)}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(180deg,rgba(242,244,238,.35) 0 6px,transparent 6px 10px)}
.tl li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding:7px 0}
.tl .lamp{margin-top:6px;position:relative}
.tl .when{font-size:12px;color:var(--mute)}
.save{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(42,86,65,.55)}
.save:last-child{border-bottom:0}
.save .who{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;flex:1 1 200px;min-width:0}
.save .noplate{background:var(--board);border-radius:6px;padding:6px 7px;box-shadow:inset 0 0 0 1px var(--bezel);min-width:52px;display:grid;place-items:center}
.save .nm{font-weight:900;font-size:16px}
.save .acts{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}

/* ---- newspaper ---- */
.paper{background:var(--paper);color:var(--ink);border-radius:2px;padding:10px 12px 12px;margin:14px 2px 6px;box-shadow:0 14px 26px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.08);transform:rotate(-1.2deg);animation:drop .55s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes drop{from{opacity:0;transform:rotate(-7deg) translateY(-16px) scale(1.05)}to{opacity:1;transform:rotate(-1.2deg)}}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:3px double var(--ink);padding-bottom:3px;margin-bottom:9px}
.paper .mast b{font-size:19px;font-weight:900;letter-spacing:.12em}
.paper .mast span{font-size:11px;color:#555}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.pleft{display:flex;flex-direction:column;min-width:0}
.kicker{align-self:flex-start;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;letter-spacing:.04em;max-width:100%;overflow-wrap:anywhere}
.paper .pname{font-size:25px;font-weight:900;line-height:1.2;margin:7px 0 5px;letter-spacing:.02em;overflow-wrap:anywhere}
.paper .lead{font-size:13px;line-height:1.7;color:#2B2F2E}
.photo{flex:1;min-height:86px;margin-top:9px;position:relative;overflow:hidden;background-color:#C9CBC2;background-image:radial-gradient(circle,#2C302E 1.05px,transparent 1.35px);background-size:5px 5px}
.photo .jersey{position:absolute;right:8px;bottom:-12px;font-size:78px;font-weight:900;line-height:1;color:#F4F4EE;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;letter-spacing:-.02em}
.vhead{display:flex;flex-direction:column;align-items:center;align-self:start;background:var(--red);color:#fff;font-weight:900;padding:12px 8px 10px;margin:0;border-radius:1px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px var(--red)}
.paper.bad .vhead{background:#1D2120;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #1D2120}
.vch{display:block;line-height:1.1;text-align:center;white-space:nowrap}
.vch.rot{transform:rotate(90deg)}
.vch.dg{font-size:.82em;letter-spacing:-.04em;line-height:1.25}

/* ---- sheet ---- */
.overlay{position:fixed;inset:0;background:rgba(4,12,8,.66);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
.sheet{width:100%;max-width:480px;background-color:var(--board);background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.3px);background-size:5px 5px;border-radius:14px;padding:18px 16px 16px;box-shadow:inset 0 0 0 1px var(--bezel),0 -10px 40px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.sheet .evt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--led);font-weight:700;margin-bottom:6px}
.sheet h2{font-size:21px;font-weight:900;margin-bottom:8px;letter-spacing:.02em}
.sheet p{margin-bottom:16px;color:#D8E1EA}
.sheet .opt{background:#132236;border-color:#2A3D56}
.sheet .opt .t{padding-right:0}
.xfer textarea{min-height:96px;resize:vertical;word-break:break-all;font-size:16px;line-height:1.4}
.xfer .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
.xfer .ok{color:var(--good);font-size:13px;margin-top:8px}
.xfer .ng{color:#FF9C92;font-size:13px;margin-top:8px}
.filebtn{position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
.teamname{font-size:26px;font-weight:900;line-height:1.3;margin:4px 0 6px;overflow-wrap:anywhere}
